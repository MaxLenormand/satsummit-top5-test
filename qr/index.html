<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowd top 5 QR</title>
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../lib/crowd.css">
<style>
  #qr svg { display: block; }
  #count { transition: opacity 0.6s ease; }
  #count .num { transition: opacity 0.25s ease; }
  .todo { position: absolute; border: 4px dashed var(--tg-rule); display: flex; align-items: center; justify-content: center;
    font: 400 30px/1.3 var(--mono); color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <div class="t-title">Guess the top 5</div>
  <div id="frame" class="lab"></div>
  <div id="qr" class="lab"></div>
  <div id="url" class="lab t-mono"></div>
  <div id="count" class="lab" style="opacity:0">
    <div class="num t-big" style="font-size:260px"></div>
    <div class="unit t-say mute" style="margin-top:34px;font-size:56px"></div>
  </div>
</div>
<!-- shared contract: crowd/config.js (vote branch) sets window.CROWD_CONFIG; missing = defaults -->
<script src="../config.js" onerror="void 0"></script>
<script src="../fixtures/meta.js"></script>
<script src="../lib/vendor/qrcode.js"></script>
<script src="../lib/tally.js"></script>
<script src="../lib/sheet.js"></script>
<script src="../lib/stage.js"></script>
<script>
/* Crowd top-5 QR slide: the QR code of voteUrl (encoded here, offline, by the vendored qrcode-generator 1.4.4, MIT),
   the short address under it, and a live vote counter (clean ballots: after startTime, one per device, valid) polled
   every 5 s. The counter shows only once the Sheet has answered; it hides after 3 failed polls in a row and never
   shows an error. One beat. ?mock=live shows fixture votes arriving. */
(function () {
  "use strict";
  const S = CrowdStage, cfg = CrowdSheet.config();
  const $ = (id) => document.getElementById(id);
  const url = String(cfg.voteUrl || "");
  const short = url.replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/$/, "");

  // layout (stage px): the QR left in the brand frame, the counter right; both centred on the same line
  const CY = 548, QCX = 470, FO = 62;          // QCX: the QR's centre x
  if (CrowdSheet.isSet(url)) {
    const q = qrcode(0, "M");                          // smallest version that fits, error correction M (15%)
    q.addData(url); q.make();
    const N = q.getModuleCount(), MOD = Math.max(8, Math.min(18, Math.floor(520 / N))), SIZE = N * MOD, QX = QCX - SIZE / 2;
    let d = "";
    for (let y = 0; y < N; y++) {
      let x = 0;
      while (x < N) {
        if (!q.isDark(y, x)) { x++; continue; }
        let e = x; while (e < N && q.isDark(y, e)) e++;
        d += `M${x} ${y}h${e - x}v1h-${e - x}z`; x = e;
      }
    }
    const Y = CY - SIZE / 2;
    $("qr").innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${SIZE}" height="${SIZE}" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" role="img" aria-label="QR code: ${S.esc(url)}"><path d="${d}" fill="var(--ink)"/></svg>`;
    Object.assign($("qr").style, { left: QX + "px", top: Y + "px" });
    $("frame").innerHTML = frame(SIZE + 2 * FO, SIZE + 2 * FO, 72);
    Object.assign($("frame").style, { left: QX - FO + "px", top: Y - FO + "px" });
    $("url").textContent = short;
    Object.assign($("url").style, { left: QX + SIZE / 2 + "px", top: Y + SIZE + FO + 44 + "px", fontSize: "44px",
      transform: "translateX(-50%)" });
    fitUrl(QX + SIZE / 2);
  } else {                                             // not configured yet: a placeholder the team will notice
    const el = document.createElement("div");
    el.className = "todo"; el.textContent = "voteUrl not set\n(crowd/config.js)"; el.style.whiteSpace = "pre";
    Object.assign(el.style, { left: QCX - 250 + "px", top: CY - 250 + "px", width: "500px", height: "500px" });
    $("stage").appendChild(el);
  }
  // keep the address on the stage: never wider than the left column, centred under the QR
  function fitUrl(cx) {
    document.fonts.ready.then(() => {
      const el = $("url"), w = el.offsetWidth, max = Math.min(2 * cx - 120, 900);
      if (w > max) el.style.fontSize = Math.floor(44 * max / w) + "px";
    });
  }
  /* the TG brand frame: one corner piece (brand kit path, as the deck's _board.js) turned to each corner */
  function frame(W, H, Sz) {
    const P = "M50,1.8H4c-1.5,0-2.7,1.2-2.7,2.7v45c0,2.9,4,3.8,5.2,1.2C15.4,31.2,31.3,15.5,51.1,7.1c2.8-1.2,1.9-5.3-1-5.3h-.1Z";
    const one = (x, y, deg) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="${Sz}" height="${Sz}" aria-hidden="true"`
      + ` style="position:absolute;left:${x}px;top:${y}px;transform:rotate(${deg}deg)"><path d="${P}" fill="var(--accent)"/></svg>`;
    return `<div style="position:relative;width:${W}px;height:${H}px">` + one(0, 0, 0) + one(W - Sz, 0, 90) + one(W - Sz, H - Sz, 180) + one(0, H - Sz, 270) + "</div>";
  }

  // the counter: right half, its number's centre line on the QR's
  const cnt = $("count");
  Object.assign(cnt.style, { left: "1330px", top: CY - 180 + "px", transform: "translateX(-50%)", textAlign: "center" });
  let shown = null, fails = 0, busy = false;
  function setCount(n) {
    if (n === shown) return;
    const num = cnt.querySelector(".num"), unit = cnt.querySelector(".unit");
    const apply = () => { num.textContent = String(n); unit.textContent = n === 1 ? "vote" : "votes"; num.style.opacity = 1; };
    if (shown == null || document.documentElement.classList.contains("still")) apply();
    else { num.style.opacity = 0; setTimeout(apply, 250); }                // numbers fade, never count up
    shown = n;
  }
  async function poll() {
    if (busy) return;
    busy = true;
    try {
      const d = await CrowdSheet.load({ timeout: 4000, retries: 0 });
      fails = 0; setCount(d.result.n); cnt.style.opacity = 1;
    } catch (e) {
      if (++fails >= 3 || shown == null) cnt.style.opacity = 0;
    }
    busy = false;
  }
  poll();
  setInterval(poll, 5000);
  window.crowdQr = { poll };
  S.start(1, () => {});
})();
</script>
</body>
</html>
